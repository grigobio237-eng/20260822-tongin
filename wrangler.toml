name = "tongin-contract-app"
compatibility_date = "2024-03-20"
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 바인딩 설정
[[d1_databases]]
binding = "DB"
database_name = "tongin-db"
database_id = "<YOUR_D1_DATABASE_ID>" # 실제 Cloudflare 대시보드에서 발급받은 ID로 교체

# Cloudflare R2 바인딩 설정
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tongin-bucket"

# 환경 변수 설정
[vars]
NEXT_PUBLIC_API_URL = "http://localhost:8788" # 로컬 개발용 URL
